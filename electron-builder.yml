appId: com.opencode.providerconfig
productName: Opencode Provider Config
directories:
  output: dist
files:
  - .next/**/*
  - src/**/*
  - public/**/*
  - package.json
  - next.config.mjs
  - electron/**/*
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
